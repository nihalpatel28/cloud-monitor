<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cloud Security Monitoring</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#0f172a,#1e293b,#111827);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:500px;
height:500px;

background:#00c6ff33;

border-radius:50%;

top:-150px;
left:-150px;

filter:blur(60px);

}

body::after{

content:"";

position:absolute;

width:450px;
height:450px;

background:#00ff8840;

border-radius:50%;

bottom:-150px;
right:-150px;

filter:blur(60px);

}

.login-box{

position:relative;

z-index:10;

width:430px;

padding:40px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.4);

text-align:center;

color:white;

}

.logo{

font-size:60px;

margin-bottom:10px;

}

h1{

margin-bottom:10px;

font-size:32px;

}

.subtitle{

color:#d1d5db;

margin-bottom:30px;

}

input{

width:100%;

padding:15px;

margin-bottom:18px;

border:none;

outline:none;

border-radius:8px;

font-size:16px;

}

button{

width:100%;

padding:15px;

background:#00BCD4;

border:none;

border-radius:8px;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#0097a7;

}

.error{

margin-top:20px;

padding:10px;

background:#ff4444;

border-radius:8px;

font-weight:bold;

}

.footer{

margin-top:25px;

font-size:14px;

color:#cbd5e1;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

🛡️

</div>

<h1>

Cloud Security Monitoring

</h1>

<p class="subtitle">

Administrator Login

</p>

<form action="/login" method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

LOGIN

</button>

</form>

{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}

<div class="footer">

AWS EC2 • Flask • Python • SQLite

</div>

</div>

</body>

</html>
